# minimaLinux · Tokyo Night
# Change these values to personalize your terminal.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

shell fish
scrollback_lines 10000
window_padding_width 12
confirm_os_window_close 1
cursor_shape beam
cursor_blink_interval 0

foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #33467c
cursor #c0caf5
url_color #7dcfff

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Managed by the minimaLinux appearance tool. New terminals use these settings.
include minima-colors.conf
include minima-profile.conf
